[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regresslens"
version = "0.2.1"
description = "Evidence-driven LLM inference performance regression analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "pydantic>=2.7,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
benchmark = ["guidellm==0.8.1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
regresslens = "regresslens.cli:main"

[tool.setuptools.package-data]
regresslens = ["web/*", "web/assets/*"]
